# r100b sandbox: a profile with NO hardware monitors (no ALSA / bluez / v4l2),
# so the private session manager never enumerates or opens the operator's devices.
wireplumber.profiles = {
  base = {
    check.no-media-session = required
    support.settings = required
    support.log-settings = required
    support.session-services = required
  }
  r100b = {
    inherits = [ base ]
    metadata.sm-settings = required
    metadata.sm-objects = required
    policy.standard = required
  }
}
