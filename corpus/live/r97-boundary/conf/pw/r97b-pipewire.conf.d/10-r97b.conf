## r97b private-core fragment. module.access MUST stay enabled (r97s L3): with
## `module.access = false` the core listens but never answers a client handshake.
## rt/profiler/portal off = no host-scheduling / desktop-integration side effects.
context.properties = {
  module.rt       = false
  module.profiler = false
  module.portal   = false
}
