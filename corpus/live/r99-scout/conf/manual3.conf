context.properties = {
    core.daemon = true
    core.name = pipewire-0
    default.clock.rate = 48000
    default.clock.quantum = 1024
    mem.warn-mlock = false
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.objects = [
    { factory = spa-node-factory args = { factory.name = support.node.driver node.name = Dummy-Driver node.group = pipewire.dummy priority.driver = 20000 } }
]
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-access }
    { name = libpipewire-module-rtp-sink
      args = {
          destination.ip = "127.0.0.1"
          destination.port = 46100
          net.mtu = 1280
          sess.min-ptime = 1
          sess.max-ptime = 1
          sess.name = "r99s manual"
          audio.format = "S16BE"
          audio.rate = 48000
          audio.channels = 2
          stream.props = { node.name = "r99s_sink" media.class = "Audio/Sink" node.virtual = false node.always-process = true node.group = pipewire.dummy priority.driver = 30000 }
      }
    }
]
