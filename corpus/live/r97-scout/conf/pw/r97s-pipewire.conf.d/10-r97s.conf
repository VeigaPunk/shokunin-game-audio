## r97-scout private-core fragment (probe of pipewire fragment merge semantics)
## MEASURED LAW (r97s L2): module.access must stay enabled. With
## `module.access = false` the core still listens on pipewire-0 but never
## answers a client handshake: pw-cli/pw-dump/wpctl hang until killed, with no
## error line. Keep it on; disable only rt/profiler/portal (host-scheduling and
## desktop-integration side effects).
context.properties = {
  module.rt       = false
  module.profiler = false
  module.portal   = false
}
