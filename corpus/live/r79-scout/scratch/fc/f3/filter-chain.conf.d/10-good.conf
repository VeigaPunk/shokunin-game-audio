                nodes = [
                    { name = mix type = builtin label = mixer
                       control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
                ]
                inputs  = [ "mix:In 1" "mix:In 2" ]
                outputs = [ "mix:Out" ]
            }
            capture.props = {
                node.name = "mix_input.r79_fc_priv_mixed"
